<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASCEC | Gallery</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="immersive-page gallery-page">
  <div class="site-video-bg" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto" poster="IMAGES/logo.jpeg">
      <source src="IMAGES/nascec-logo-animation.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>
  </div>

  <header>
    <div id="logo_container">
      <img src="IMAGES/logo.jpeg" alt="NASCEC Logo" class="logo">
      <h1>NASCEC</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="programs.html">Programs</a>
      <a href="stories.html">Stories</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="page-hero glass-panel">
      <p class="page-kicker">Gallery</p>
      <h2>NASCEC in Action</h2>
      
    </section>

    <section class="glass-panel">
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  

  <script>
    fetch("/api/gallery")
      .then(res => res.json())
      .then(data => {
        const galleryContainer = document.getElementById("gallery");
        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "gallery-item";
          div.innerHTML = `
            <img src="${item.image}" alt="${item.title}">
            <div class="gallery-description">
              <h3>${item.title}</h3>
              <p>${item.description}</p>
            </div>
          `;
          galleryContainer.appendChild(div);
        });
      })
      .catch(err => console.error("Error loading gallery:", err));
  </script>
</body>
<footer>
    &copy; 2026 Native Storytelling for Culture and Environment Conservation (NASCEC)
  </footer>

</html>
