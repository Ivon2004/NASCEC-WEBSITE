<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
    .container { width: 420px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #2e7d32; margin-top: 0; }
    form { display: flex; flex-direction: column; gap: 10px; }
    input, button { padding: 10px; } 
    button { background: #2e7d32; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #1b5e20; }
    .message { color: #b00020; min-height: 20px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Global Sign In</h2>
    <p>Sign in to continue as a regular user or an administrator.</p>
    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p id="loginMsg" class="message" aria-live="polite"></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.textContent = '';

      const formData = new FormData(loginForm);
      const payload = {
        username: String(formData.get('username') || ''),
        password: String(formData.get('password') || '')
      };

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed');
        }

        if (data.role === 'admin') {
          window.location.href = '/admin_panel.html';
        } else {
          window.location.href = data.redirectTo || '/field_data.html';
        }
      } catch (err) {
        loginMsg.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
